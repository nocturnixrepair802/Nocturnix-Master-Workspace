[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nocturnix-ai-assistant"
version = "0.1.6"
description = "Development-only FastAPI foundation with authentication and OAuth security foundation for Nocturnix AI Assistant"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2.8", "pydantic-settings>=2.4", "SQLAlchemy>=2.0", "alembic>=1.13", "cryptography>=42", "pwdlib[argon2]>=0.2", "openai>=1.68,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "bandit[toml]>=1.7", "pip-audit>=2.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nocturnix = ["static/*", "knowledge/*.md"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101", "B008"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = false
ignore_missing_imports = true
mypy_path = "src"

[tool.pytest.ini_options]
addopts = "--cov=src/nocturnix --cov-report=term-missing --cov-fail-under=85"
# v0.1.4 adds security abstractions whose exhaustive branch coverage is tested at service/API seams.

testpaths = ["tests"]
pythonpath = ["src"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]
