<!doctype html>
<html lang="en">
<head>

    <!-- ======================================================
         Meta Information
    ======================================================= -->

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nocturnix Business Portal</title>

    <!-- ======================================================
         Stylesheets
    ======================================================= -->

    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="assets/css/layout.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/dashboard.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
    <link rel="stylesheet" href="assets/css/style.css">

</head>

<body>

    <!-- ======================================================
         Header
    ======================================================= -->

    <header>

        <div class="header-left">

            <div class="logo">🛠</div>

            <div class="title-group">

                <h1>Nocturnix Business Portal</h1>

                <span>Business Management System</span>

            </div>

        </div>

        <div class="header-center">

            <input
                type="search"
                class="search-box"
                placeholder="Search the Portal..."
            >

        </div>

        <div class="header-right">

            <span class="version">
                Version 0.5.0 Alpha
            </span>

            <button class="profile-button">
                Ryan
            </button>

        </div>

    </header>

    <!-- ======================================================
         Portal Container
    ======================================================= -->

    <div class="portal-container">

        <!-- ======================================================
             Sidebar
        ======================================================= -->

        <aside class="sidebar">

            <h2>Navigation</h2>

        <nav>
            <ul>

                <li>
                    <a
                        href="#/dashboard"
                        data-route="/dashboard"
                    >
                        🏠 Dashboard
                    </a>
                </li>

                <li>
                    <a
                        href="#"
                    >
                        🎨 Brand Center
                    </a>
                </li>

                <li>
                    <a
                        href="#/repairs"
                        data-route="/repairs"
                    >
                        📱 Repair Operations
                    </a>
                </li>

                <li>
                    <a
                        href="#/customers"
                        data-route="/customers"
                    >
                        👥 Customers
                    </a>
                </li>

                <li>
                    <a
                        href="#"
                    >
                        ⚙️ Settings
                    </a>
                </li>

            </ul>
        </nav>

        </aside>

        <!-- ======================================================
             Main Workspace
        ======================================================= -->

        <main class="workspace">
            <section class="portal-loading">
                <h2>Loading Nocturnix...</h2>
                <p>Preparing the Business Portal...</p>
            </section>
        </main>

    </div>


    <!-- ======================================================
         Footer
    ======================================================= -->

    <footer>

        © 2026 Nocturnix Mobile Repair • Version 0.5.0 Alpha

    </footer>

    <!-- ======================================================
         JavaScript
    ======================================================= -->


    <script src="assets/js/router.js"></script>
    <script src="assets/js/app.js"></script>

    </body>
    </html>
