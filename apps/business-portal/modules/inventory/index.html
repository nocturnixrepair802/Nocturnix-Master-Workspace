<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Inventory Manager</title>

    <link rel="stylesheet" href="../../assets/css/variables.css" />
    <link rel="stylesheet" href="../../assets/css/style.css" />
    <link rel="stylesheet" href="inventory.css" />
  </head>

  <body>
    <main class="workspace">
      <h1>Inventory Manager</h1>

      <p>Manage repair parts and accessories.</p>

      <div class="toolbar">
        <input type="search" placeholder="Search inventory..." />

        <button class="primary-button">+ Add Part</button>
      </div>

      <table class="inventory-table">
        <thead>
          <tr>
            <th>Part</th>

            <th>Manufacturer</th>

            <th>Quantity</th>

            <th>Location</th>

            <th>Status</th>
          </tr>
        </thead>

        <tbody>
          <tr>
            <td>iPhone 15 OLED Display</td>

            <td>Apple</td>

            <td>3</td>

            <td>Shelf A-1</td>

            <td>In Stock</td>
          </tr>

          <tr>
            <td>Galaxy S24 Battery</td>

            <td>Samsung</td>

            <td>1</td>

            <td>Shelf B-2</td>

            <td>Low Stock</td>
          </tr>

          <tr>
            <td>USB-C Charge Port</td>

            <td>Generic</td>

            <td>14</td>

            <td>Drawer C</td>

            <td>In Stock</td>
          </tr>
        </tbody>
      </table>
    </main>
  </body>
</html>
