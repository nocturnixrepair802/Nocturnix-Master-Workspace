<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Customer Management</title>

    <link rel="stylesheet" href="../../assets/css/variables.css" />
    <link rel="stylesheet" href="../../assets/css/style.css" />
    <link rel="stylesheet" href="customers.css" />
  </head>

  <body>
    <main class="workspace">
      <h1>Customer Management</h1>

      <p>Manage customer information and repair history.</p>

      <div class="toolbar">
        <input type="search" placeholder="Search customer..." />

        <button class="primary-button">+ New Customer</button>
      </div>

      <div class="customer-table">
        <table>
          <thead>
            <tr>
              <th>Name</th>

              <th>Phone</th>

              <th>Email</th>

              <th>Repairs</th>

              <th>Status</th>
            </tr>
          </thead>

          <tbody>
            <tr>
              <td>John Smith</td>

              <td>(555) 555-1234</td>

              <td>john@email.com</td>

              <td>5</td>

              <td>Active</td>
            </tr>

            <tr>
              <td>Jane Doe</td>

              <td>(555) 555-9876</td>

              <td>jane@email.com</td>

              <td>2</td>

              <td>Active</td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </body>
</html>
