<div class="repair-toolbar">
  <button id="newRepairButton" class="action-button">+ New Repair</button>

  <input type="search" id="repairSearch" placeholder="Search repairs..." />

  <select id="repairFilter">
    <option value="all">All Repairs</option>

    <option value="new">New Intake</option>

    <option value="diagnosing">Diagnosing</option>

    <option value="parts">Waiting on Parts</option>

    <option value="repairing">Repairing</option>

    <option value="pickup">Ready for Pickup</option>

    <option value="completed">Completed</option>
  </select>
</div>
