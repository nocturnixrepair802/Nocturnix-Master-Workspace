<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Repair Queue</title>

    <link rel="stylesheet" href="../../assets/css/variables.css" />
    <link rel="stylesheet" href="../../assets/css/style.css" />
    <link rel="stylesheet" href="repair-queue.css" />
  </head>

  <body>
    <main class="workspace">
      <h1>Repair Queue</h1>

      <p>Track every repair from intake to completion.</p>

      <div class="kanban-board">
        <div class="kanban-column">
          <h2>New Intake</h2>

          <div class="repair-ticket">
            <strong>John Smith</strong>

            <p>iPhone 15 Pro Max</p>
          </div>
        </div>

        <div class="kanban-column">
          <h2>Diagnosing</h2>

          <div class="repair-ticket">
            <strong>Jane Doe</strong>

            <p>Galaxy S24 Ultra</p>
          </div>
        </div>

        <div class="kanban-column">
          <h2>Waiting on Parts</h2>

          <div class="repair-ticket">
            <strong>Mike Jones</strong>

            <p>Pixel 9 Pro</p>
          </div>
        </div>

        <div class="kanban-column">
          <h2>Repairing</h2>
        </div>

        <div class="kanban-column">
          <h2>Ready for Pickup</h2>
        </div>

        <div class="kanban-column">
          <h2>Completed</h2>
        </div>
      </div>
    </main>
  </body>
</html>
