<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="/manifest.webmanifest"><title>Nocturnix Dev</title><style>body{margin:0;font-family:system-ui;background:#101218;color:#f8f9fb}main{max-width:1100px;margin:auto;padding:1rem}.warning{border:3px solid #ffd166;background:#332b00;padding:1rem;border-radius:12px}section{background:#1d2130;margin:1rem 0;padding:1rem;border-radius:12px}label{display:block;margin:.75rem 0}input,textarea,select,button{box-sizing:border-box;width:100%;padding:.8rem;border-radius:10px;border:2px solid #68708a}button{background:#8ecae6;color:#001219;font-weight:700;cursor:pointer}:focus{outline:4px solid #ffb703;outline-offset:2px}.grid{display:grid;gap:1rem}@media(min-width:760px){.grid{grid-template-columns:repeat(2,1fr)}}pre{white-space:pre-wrap;background:#06070a;padding:1rem;border-radius:12px}</style></head><body><main><h1>Nocturnix AI Assistant</h1><p class="warning" role="alert">Development-only mock UI. No live providers are connected and no write actions execute without approval.</p><div class="grid"><section><h2>Chat</h2><label for="chatMessage">Message</label><textarea id="chatMessage"></textarea><button onclick="post('/api/v1/chat',{message:chatMessage.value})">Send mock chat</button></section><section><h2>Repair intake</h2><label for="device">Device type</label><input id="device"><label for="issue">Issue</label><textarea id="issue"></textarea><button onclick="post('/api/v1/repair-intakes',{device_type:device.value,issue_description:issue.value})">Create intake</button></section><section><h2>Approvals</h2><button onclick="get('/api/v1/approvals')">Load approval inbox</button></section><section><h2>Mock email</h2><button onclick="get('/api/v1/mock/email/messages')">Load mock email</button></section><section><h2>Mock calendar</h2><button onclick="get('/api/v1/mock/calendar/events')">Load mock calendar</button></section><section><h2>Status</h2><button onclick="get('/api/v1/status')">Load status</button></section></div><h2>Response</h2><pre id="output" aria-live="polite"></pre></main><script>const headers={'Content-Type':'application/json','X-Nocturnix-Dev-User':'dev-user-001'};async function show(p){const r=await p;output.textContent=JSON.stringify(await r.json(),null,2)}function get(u){show(fetch(u,{headers}))}function post(u,b){show(fetch(u,{method:'POST',headers,body:JSON.stringify(b)}))}if('serviceWorker'in navigator)navigator.serviceWorker.register('/service-worker.js');</script></body></html>
