<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nocturnix Repair Dashboard</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f8fa;
        --panel: #ffffff;
        --ink: #18202a;
        --muted: #5e6a78;
        --line: #d9dee6;
        --accent: #0f766e;
        --accent-2: #2563eb;
        --danger: #b42318;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 14px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      header {
        align-items: center;
        background: var(--panel);
        border-bottom: 1px solid var(--line);
        display: flex;
        gap: 16px;
        justify-content: space-between;
        padding: 18px clamp(16px, 4vw, 40px);
      }

      h1 {
        font-size: clamp(22px, 3vw, 30px);
        margin: 0;
      }

      main {
        display: grid;
        gap: 20px;
        margin: 0 auto;
        max-width: 1180px;
        padding: 24px clamp(16px, 4vw, 40px) 40px;
      }

      button,
      input,
      select {
        border: 1px solid var(--line);
        border-radius: 6px;
        font: inherit;
      }

      button {
        background: var(--accent);
        color: white;
        cursor: pointer;
        min-height: 38px;
        padding: 0 14px;
      }

      input {
        min-height: 38px;
        min-width: 220px;
        padding: 0 10px;
      }

      .toolbar {
        align-items: center;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .muted {
        color: var(--muted);
      }

      .metrics {
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      }

      .metric,
      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
      }

      .metric {
        padding: 16px;
      }

      .metric strong {
        display: block;
        font-size: 28px;
        line-height: 1.1;
      }

      .panel {
        overflow: hidden;
      }

      .panel h2 {
        border-bottom: 1px solid var(--line);
        font-size: 16px;
        margin: 0;
        padding: 14px 16px;
      }

      .split {
        display: grid;
        gap: 20px;
        grid-template-columns: minmax(0, 1fr) minmax(280px, 360px);
      }

      table {
        border-collapse: collapse;
        width: 100%;
      }

      th,
      td {
        border-bottom: 1px solid var(--line);
        padding: 12px 16px;
        text-align: left;
        vertical-align: top;
      }

      th {
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
      }

      .badge {
        border-radius: 999px;
        display: inline-block;
        font-size: 12px;
        font-weight: 700;
        padding: 3px 8px;
      }

      .priority-urgent,
      .priority-high {
        background: #fee4e2;
        color: var(--danger);
      }

      .priority-normal {
        background: #dbeafe;
        color: #1d4ed8;
      }

      .priority-low {
        background: #dcfce7;
        color: #166534;
      }

      .bars {
        display: grid;
        gap: 10px;
        padding: 16px;
      }

      .bar-row {
        display: grid;
        gap: 6px;
      }

      .bar-label {
        display: flex;
        justify-content: space-between;
      }

      .bar {
        background: #eef1f5;
        border-radius: 999px;
        height: 9px;
        overflow: hidden;
      }

      .bar span {
        background: var(--accent-2);
        display: block;
        height: 100%;
        min-width: 2px;
      }

      .error {
        color: var(--danger);
      }

      @media (max-width: 820px) {
        header,
        .split {
          display: block;
        }

        .toolbar {
          margin-top: 12px;
        }

        table,
        thead,
        tbody,
        tr,
        th,
        td {
          display: block;
        }

        thead {
          display: none;
        }

        tr {
          border-bottom: 1px solid var(--line);
          padding: 10px 0;
        }

        td {
          border: 0;
          padding: 4px 16px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>Repair Dashboard</h1>
        <div class="muted" id="status">Development-only repair queue</div>
      </div>
      <div class="toolbar">
        <input id="devUser" value="repair-owner-001" aria-label="Development user" />
        <button id="refresh">Refresh</button>
      </div>
    </header>

    <main>
      <section class="metrics" id="metrics"></section>

      <section class="split">
        <div class="panel">
          <h2>Recent Repair Queue</h2>
          <table>
            <thead>
              <tr>
                <th>Ticket</th>
                <th>Customer</th>
                <th>Device</th>
                <th>Status</th>
                <th>Priority</th>
                <th>Estimate</th>
              </tr>
            </thead>
            <tbody id="queue"></tbody>
          </table>
        </div>

        <div class="panel">
          <h2>Status Mix</h2>
          <div class="bars" id="statusBars"></div>
        </div>
      </section>
    </main>

    <script>
      const metricLabels = {
        total_customers: "Customers",
        total_devices: "Devices",
        total_tickets: "Tickets",
        open_tickets: "Open",
        urgent_tickets: "Urgent",
        awaiting_approval: "Awaiting approval",
        ready_for_pickup: "Ready",
        completed_tickets: "Completed"
      };

      function title(value) {
        return String(value).replaceAll("_", " ");
      }

      function money(cents, currency) {
        if (cents === null || cents === undefined) return "Not set";
        return new Intl.NumberFormat("en-US", {
          style: "currency",
          currency: currency || "USD"
        }).format(cents / 100);
      }

      function renderMetrics(summary) {
        document.querySelector("#metrics").innerHTML = Object.entries(metricLabels)
          .map(([key, label]) => `<div class="metric"><span class="muted">${label}</span><strong>${summary[key] ?? 0}</strong></div>`)
          .join("");
      }

      function renderQueue(items) {
        const body = document.querySelector("#queue");
        if (!items.length) {
          body.innerHTML = `<tr><td colspan="6" class="muted">No repair tickets yet.</td></tr>`;
          return;
        }
        body.innerHTML = items.map((item) => `
          <tr>
            <td><strong>${item.ticket_number}</strong><br><span class="muted">${item.issue_description}</span></td>
            <td>${item.customer_name}</td>
            <td>${item.device_label}</td>
            <td>${title(item.status)}</td>
            <td><span class="badge priority-${item.priority}">${title(item.priority)}</span></td>
            <td>${money(item.approved_cost_cents ?? item.estimated_cost_cents, item.currency)}</td>
          </tr>
        `).join("");
      }

      function renderBars(counts) {
        const max = Math.max(...Object.values(counts), 1);
        document.querySelector("#statusBars").innerHTML = Object.entries(counts)
          .filter(([, count]) => count > 0)
          .map(([status, count]) => `
            <div class="bar-row">
              <div class="bar-label"><span>${title(status)}</span><strong>${count}</strong></div>
              <div class="bar"><span style="width:${Math.max(4, (count / max) * 100)}%"></span></div>
            </div>
          `).join("") || `<div class="muted">No ticket status data yet.</div>`;
      }

      async function loadDashboard() {
        const status = document.querySelector("#status");
        status.textContent = "Loading repair queue...";
        status.className = "muted";
        try {
          const response = await fetch("/api/v1/dashboard/repairs", {
            headers: { "X-Nocturnix-Dev-User": document.querySelector("#devUser").value.trim() }
          });
          if (!response.ok) throw new Error(`Dashboard request failed: ${response.status}`);
          const data = await response.json();
          renderMetrics(data.summary);
          renderQueue(data.recent_queue);
          renderBars(data.tickets_by_status);
          status.textContent = data.development_only ? "Development-only repair queue" : "Repair queue";
        } catch (error) {
          status.textContent = error.message;
          status.className = "error";
        }
      }

      document.querySelector("#refresh").addEventListener("click", loadDashboard);
      loadDashboard();
    </script>
  </body>
</html>
